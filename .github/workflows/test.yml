name: Test manifests

# Validates the WinGet manifests and installs them on a clean Windows runner.
# This repository is a staging area; the public submission is a pull request to
# microsoft/winget-pkgs.
on:
  push:
    paths:
      - "manifests/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

jobs:
  winget:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [kuml-desktop]
    steps:
      - uses: actions/checkout@v4

      - name: Show winget
        shell: pwsh
        run: |
          $w = Get-Command winget -ErrorAction SilentlyContinue
          if (-not $w) { throw "winget is not available on this runner" }
          winget --version

      - name: Validate the manifests
        shell: pwsh
        run: |
          $dir = (Get-ChildItem "manifests/k/kuml-dev/${{ matrix.package }}/*" -Directory | Select-Object -First 1).FullName
          winget validate --manifest $dir

      - name: Install from the local manifest
        shell: pwsh
        run: |
          winget settings --enable LocalManifestFiles
          $dir = (Get-ChildItem "manifests/k/kuml-dev/${{ matrix.package }}/*" -Directory | Select-Object -First 1).FullName
          winget install --manifest $dir --accept-package-agreements --accept-source-agreements --silent --disable-interactivity --verbose-logs
          winget list --name kuml-desktop --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { throw "kuml-desktop is not listed as installed" }

      - name: Upload winget logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winget-logs
          path: ~/AppData/Local/Packages/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe/LocalState/DiagOutputDir/
          if-no-files-found: ignore

      - name: Uninstall
        shell: pwsh
        run: |
          $dir = (Get-ChildItem "manifests/k/kuml-dev/${{ matrix.package }}/*" -Directory | Select-Object -First 1).FullName
          winget uninstall --manifest $dir --silent --disable-interactivity --accept-source-agreements
          $left = winget list --name kuml-desktop --accept-source-agreements | Out-String
          Write-Host $left
          if ($left -match 'ARP\\') { throw "kuml-desktop is still installed" }
